const NODES=[{"id": "content/blog", "type": "Domain", "title": "Blog", "description": "Posts are rows in Cloudflare D1, not files \u2014 written and inserted by a different repo, and rendered by a live edge query on every request.", "tags": ["blog", "d1", "cloudflare", "content", "edge"], "group": "content", "sz": 38, "body": "# Overview\n\nThere is **no MDX, no CMS and no `content/` directory**. Blog posts are rows in\nthe Cloudflare D1 database `cybiqon-blog`, and this repo only *reads* them.\n\n**Posts are authored and inserted by `tools/social-media-manager`** \u2014 a separate\nrepo running a daily Claude-agent pipeline. Nothing in this repo creates a post.\n\n76 posts live, 15 Mar \u2192 25 Jul 2026, roughly one per day.\n\n# Table\n\n```sql\nCREATE TABLE blog_posts (\n  id         INTEGER PRIMARY KEY AUTOINCREMENT,\n  slug       TEXT UNIQUE NOT NULL,\n  title      TEXT NOT NULL,\n  excerpt    TEXT,\n  content    TEXT NOT NULL,   -- HTML, pre-rendered at publish time\n  image_url  TEXT,            -- absolute, on media.cybiqon.in (R2)\n  topic      TEXT,\n  angle      TEXT,            -- pain_point | education | outcome | news_hook\n  tags       TEXT,            -- comma-separated string, not a relation\n  published  BOOLEAN DEFAULT 1,\n  created_at DATETIME DEFAULT CURRENT_TIMESTAMP\n);\n```\n\n`content` is **HTML**, not markdown \u2014 the publishing script renders it before\ninsert, so the site does no markdown processing at all.\n\n# Rendering\n\n**Index** (`app/blog/page.tsx`, edge):\n\n```sql\nSELECT id, slug, title, excerpt, image_url, tags, created_at\nFROM blog_posts WHERE published = 1 ORDER BY created_at DESC LIMIT 30\n```\n\nwrapped in try/catch \u2192 empty state on failure. Rows go to\n`components/blog/BlogTagFilter.tsx` (client-side tag filter, max 8 tags, 9 posts\nper page) \u2192 `components/blog/BlogCard.tsx`.\n\n**Detail** (`app/blog/[slug]/page.tsx`, edge): `SELECT * \u2026 WHERE slug = ? AND\npublished = 1`, `notFound()` if missing. `generateMetadata` runs a **second**\nquery. Content is injected with `dangerouslySetInnerHTML` after an H1\u2192H2 rewrite\n(the page supplies its own H1). Reading time is words \u00f7 200.\n\n# Two consequences worth knowing\n\n**No static generation.** There is no `generateStaticParams` and no ISR, so\n**every post render is a live D1 query at the edge** \u2014 and the detail page runs\ntwo. Acceptable at current traffic; the first thing to change if it grows.\n\n**Tags have no URLs.** They are stored on every row and filtered entirely\nclient-side, so there are no `/blog/tag/[tag]` routes for search to index.\n`components/blog/TagPill.tsx` is display-only. Free SEO surface, unclaimed.\n\n# Trusting the HTML\n\n`dangerouslySetInnerHTML` is safe *here* because the only writer is the company's\nown publishing script. It would stop being safe the moment anything else could\ninsert a row \u2014 worth remembering if the blog ever accepts guest posts.\n\n# Images\n\n`image_url` points at R2 via `media.cybiqon.in`. Commit `6657e66` fixed thumbnails\nfailing to load under **Cloudflare Hotlink Protection** \u2014 worth knowing if images\nbreak again.\n\n# See also\n\n- [SEO](/site/seo.md) \u2014 missing RSS and tag routes\n- [Stack & deployment](/site/stack.md) \u2014 the D1 binding and edge runtime\n- The `social-media-manager` bundle \u2014 where posts actually come from"}, {"id": "content/content-data", "type": "Reference", "title": "Content data", "description": "There is no data directory \u2014 every content list is a const array inside the component that renders it, which is why the portfolio can't be reused anywhere.", "tags": ["content", "data", "refactor", "portfolio"], "group": "content", "sz": 35, "body": "# Overview\n\n**The repo has no `data/` directory.** Every list of content \u2014 services, pricing\ntiers, FAQs, portfolio items, case studies \u2014 is a `const` array declared inside\nthe component that renders it.\n\n| Content | Location |\n|---|---|\n| `portfolioItems` (5) | `app/our-works/page.tsx:32` |\n| `categories` | `app/our-works/page.tsx:110` |\n| `services` (price tiers) | `app/pricing/page.tsx:57` |\n| `faqs` | `app/pricing/page.tsx:151` |\n| `productSchema` | `app/pricing/page.tsx:42` |\n| `featuredCaseStudy` | `app/case-studies/page.tsx:35` |\n| `faqCategories` | `app/faq/page.tsx:17` |\n| `howItWorksSteps` | `app/page.tsx:22` |\n| service/stat/industry lists | `components/{Services,Stats,WhyChooseUs,ProblemsWeSolve,IndustryShowcase,HeroSocialProof}.tsx` |\n\n# What it costs\n\nContent and presentation are welded together, so:\n\n- The portfolio **cannot be reused** \u2014 not in a proposal, not in a case-study\n  page, not in an email\n- Updating a price means editing a client component\n- Nothing can be validated, counted or queried\n\n# The queued fix\n\nThe `/apps` hub introduces the first `data/apps.ts`, establishing the pattern:\n\n```\ndata/apps.ts     \u2192 app/apps/page.tsx + app/apps/[slug]/\u2026\ndata/works.ts    \u2192 app/our-works + /case-studies   (after Launch-5 clients exist)\n```\n\n`data/works.ts` is deliberately sequenced **after** the free-website clients\nexist. Extracting five unnamed demo projects into a data file just relocates the\nproblem \u2014 the page's real deficiency is that it has no real clients to show.\n\n# Honesty flags\n\n**`features/`** holds opt-in experimental components. `features/README.md` marks\nthem as such, and two \u2014 `LiveActivityTicker` and `SocialProofBar` \u2014 contain\n**invented social proof**. Check before reusing anything from that directory.\n\n**`components/Testimonials.tsx`** deliberately holds **one real testimonial**\n(LeadzGalaxy / Amit Menon) after placeholders were removed, with a comment saying\nso. Keep it that way \u2014 the whole point of the Launch-5 programme is to earn more\nreal ones.\n\n# Assets\n\n`public/portfolio/*.webp` (15) \u00b7 `public/logo.png` \u00b7 `public/founder1.jpg`,\n`founder2.jpg`. `scripts/shoot-home.mjs` is a Playwright screenshot helper.\n\n# See also\n\n- [Routes](/site/routes.md) \u2014 where the `/apps` data file lands\n- [SEO](/site/seo.md) \u2014 the client-component problem these arrays sit inside"}, {"id": "content/lead-capture", "type": "Domain", "title": "Lead capture", "description": "One form on the whole site, writing to D1 and emailing via Resend \u2014 plus a set of off-site CTAs that nothing measures.", "tags": ["leads", "forms", "d1", "resend", "conversion"], "group": "content", "sz": 36, "body": "# Overview\n\nThe site has exactly **one form**.\n\n```\n/free-audit\n   \u2514\u2500 components/AuditForm.tsx        react-hook-form + zod\n        name \u22652 \u00b7 email \u00b7 phone ^\\d{10,}$ \u00b7 website_url URL\n      POST /api/audit                 (edge)\n        \u2502  re-validates with the same zod schema\n        \u251c\u2500> INSERT INTO audit_leads (name, email, phone, website_url)   [D1]\n        \u2514\u2500> POST https://api.resend.com/emails\n              from noreply@cybiqon.in \u2192 to support@cybiqon.in\n```\n\n`audit_leads` is defined in `migrations/0002_audit_leads.sql` with `status`\ndefaulting to `'new'`, and lives in the **same D1 database as the blog**.\n\n# Design notes\n\n**Validation runs twice**, client and server, from the same zod schema \u2014 correct,\nsince the client check is only UX.\n\n**The email is best-effort.** A Resend failure is caught and swallowed, so the\nlead is still stored. Right call: the D1 row is the durable artifact and losing it\nwould be far worse than a missed notification. But it does mean **a silent\nnotification failure looks like \"no leads\"** \u2014 a pattern this company has been\nbitten by elsewhere.\n\n# Gaps\n\n- **No captcha and no rate limiting** on a public endpoint that triggers outbound\n  email.\n- The HTML email body **interpolates user input unescaped**. Low blast radius \u2014 it\n  lands in the founder's own inbox \u2014 but it should be escaped.\n- **No conversion tracking.** GA4 is loaded but fires no event on form success. The\n  one measurable conversion on the site is unmeasured.\n\n# Everything else is off-site\n\n| CTA | Where |\n|---|---|\n| WhatsApp `wa.me/919250711473` | Navbar, Footer, WhatsAppWidget, BlogCTA, pricing, faq |\n| `mailto:support@cybiqon.in` | Footer, contact |\n| TidyCal booking | pricing, faq, contact |\n\n**None of these fire an analytics event either**, so the site cannot answer which\nCTA works.\n\n# The bigger miss\n\n**There is no newsletter signup anywhere.** 76 blog posts have been published with\nno email capture on any of them \u2014 every reader arrives, reads, and leaves with no\nway to be reached again. For a content engine running daily, this is the largest\nunclaimed conversion surface on the site.\n\n# What's coming\n\nThe Launch-5 free-website offer needs `/free-website` plus\n`app/api/apply/route.ts`. **Clone `app/api/audit/route.ts`** \u2014 same shape: zod\nvalidate, D1 insert, best-effort Resend notification. Add the rate limiting and\nescaping that route is missing while you're there.\n\n# See also\n\n- [Routes](/site/routes.md) \u2014 the API surface\n- [SEO](/site/seo.md) \u2014 why conversions aren't measured"}, {"id": "site/routes", "type": "Reference", "title": "Routes", "description": "Every route the site serves, which are server vs client components, and the ones that 404 today despite being linked from structured data.", "tags": ["routes", "app-router", "nextjs", 404], "group": "site", "sz": 36, "body": "# Marketing pages\n\n| Route | File | Rendering |\n|---|---|---|\n| `/` | `app/page.tsx` | server \u2014 metadata + Service/Breadcrumb JSON-LD |\n| `/about` | `app/about/page.tsx` | **client** |\n| `/our-works` | `app/our-works/page.tsx` | **client** |\n| `/pricing` | `app/pricing/page.tsx` | **client** |\n| `/process` | `app/process/page.tsx` | **client** |\n| `/case-studies` | `app/case-studies/page.tsx` | **client** |\n| `/faq` | `app/faq/page.tsx` | **client** \u2014 FAQPage JSON-LD |\n| `/contact` | `app/contact/page.tsx` | **client** |\n| `/free-audit` | `app/free-audit/page.tsx` | server + metadata |\n| `/privacy`, `/terms` | | server |\n\nThe seven `\"use client\"` pages **export no metadata at all** \u2014 see\n[SEO](/site/seo.md). That is the single highest-value fix on the site.\n\n# Blog\n\n| Route | Notes |\n|---|---|\n| `/blog` | server, `runtime=\"edge\"`, D1 query, 30 most recent |\n| `/blog/[slug]` | server, `runtime=\"edge\"`, live D1 query per render |\n\n# Apps\n\n```\napp/apps/llmbytes/privacy/page.tsx     \u2705 200\napp/apps/llmbytes/terms/page.tsx       \u2705 200\n```\n\nThat is the **entire** contents of `app/apps/`. There is no `app/apps/page.tsx`,\nno `[slug]` route, and no `app/apps/llmbytes/page.tsx`.\n\n**404 today:** `/apps` \u00b7 `/apps/llmbytes` \u00b7 `/rss.xml`\n\nBoth existing pages emit BreadcrumbList JSON-LD pointing at\n`https://cybiqon.in/apps/llmbytes` \u2014 **a URL that does not exist**. Structured\ndata asserting a 404 is worse than omitting it.\n\nBoth pages are hand-written JSX (326 and 264 lines) with the legal copy inline.\nThe queued fix replaces them with `data/apps.ts` + `app/apps/page.tsx` +\n`app/apps/[slug]/{page,privacy,terms}` covering llmbytes, meflow and vitaloop.\n\nThat also unblocks **VitaLoop's Play Store submission**, which currently points at\n`vitaloop.app/privacy` \u2014 a domain that resolves to nothing.\n\n# API\n\nAll `runtime=\"edge\"`:\n\n| Route | Purpose |\n|---|---|\n| `GET /api/blog` | list posts |\n| `GET /api/blog/[slug]` | one post |\n| `POST /api/audit` | the only write \u2014 see [lead capture](/content/lead-capture.md) |\n\n# Generated\n\n`app/sitemap.ts` (edge \u2014 14 static URLs + D1 blog URLs, try/catch falls back to\nstatic-only) \u00b7 `app/robots.ts` \u00b7 `app/not-found.tsx`\n\n**No `app/rss.xml/route.ts`** \u2014 confirmed 404. The D1 query in `sitemap.ts` is\ndirectly reusable for it.\n\n# Layout\n\n`app/layout.tsx` wraps everything in Navbar / Footer / WhatsAppWidget /\nRevealObserver / Toaster / Sonner / TooltipProvider, and carries the GA4 snippet.\n\n# See also\n\n- [SEO](/site/seo.md) \u2014 the metadata gap on the client pages\n- [Lead capture](/content/lead-capture.md) \u2014 the one write path"}, {"id": "site/seo", "type": "Domain", "title": "SEO", "description": "Strong structured data and a working sitemap, undermined by seven commercial pages that export no metadata at all because they are client components.", "tags": ["seo", "metadata", "json-ld", "sitemap", "search-console"], "group": "site", "sz": 41, "body": "# Overview\n\nThe site publishes a blog post **every single day**. Its seven highest\ncommercial-intent pages are **invisible to search**. Both things have been true\nfor months.\n\n# What works\n\n**`app/layout.tsx`** \u2014 `metadataBase`, title template `%s | Cybiqon AI Solutions`,\ndefault description, robots/googleBot directives, OpenGraph (website, `en_IN`,\n`/logo.png` 1200\u00d7630), Twitter `summary_large_image` `@CybiqonAI`, `theme-color`,\nand hreflang alternates (en-IN / en / x-default).\n\n**JSON-LD** is genuinely well covered:\n\n| Schema | Where |\n|---|---|\n| Organization + ProfessionalService | layout |\n| Service ItemList + Breadcrumb | `/` |\n| FAQPage | `/faq` |\n| LocalBusiness + Breadcrumb | `/contact` |\n| Article + Breadcrumb | `/blog/[slug]` |\n| Product | `/pricing` |\n| Breadcrumb | blog index, about, free-audit, case-studies, apps pages |\n\n**`app/sitemap.ts`** \u2014 edge runtime, 14 hardcoded static URLs plus every published\nblog slug from D1, wrapped in try/catch so a D1 failure degrades to static-only\nrather than serving nothing. **`app/robots.ts`** \u2014 allows `/`, disallows `/api/`\nand `/_next/`, declares the sitemap.\n\n# The gap that costs money\n\n**Seven pages are `\"use client\"`, so they export no `metadata` object at all:**\n\n```\n/pricing   /our-works   /case-studies   /contact   /about   /process   /faq\n```\n\nNo unique `<title>`, no description, no `alternates.canonical`, no OpenGraph.\nThey inherit only the root defaults, so Google sees seven pages with effectively\nthe same title and no canonical signal.\n\nThese are the pages someone lands on when they are ready to buy.\n\n**The fix is mechanical and identical for each:** rename the existing file to a\nco-located client child, and add a thin *server* `page.tsx` that exports metadata\nand renders it.\n\n```\napp/pricing/page.tsx          \u2192 server wrapper, exports metadata\napp/pricing/PricingClient.tsx \u2192 the existing \"use client\" body, unchanged\n```\n\nOrder by commercial intent: **pricing \u2192 our-works \u2192 contact**, then the rest.\n\n# Also missing\n\n| Gap | Consequence |\n|---|---|\n| **No Search Console verification** | no `verification` key in metadata |\n| **No RSS feed** | `/rss.xml` 404s |\n| **No tag routes** | tag filtering is client-side only, so tags have zero indexable URLs despite being stored on every post |\n| **No OG image generation** | every page shares `/logo.png`; only blog posts get a real image |\n| `sitemap.ts` `lastModified` | uses `new Date()` for every static page \u2014 everything always claims to have changed today, a weak and noisy signal |\n| **No author / E-E-A-T page** | posts credit \"Cybiqon Team\" with no link |\n\n# Indexing is not being submitted\n\nSeparate from this repo but directly downstream: the blog pipeline submits new\nURLs to the **Google Indexing API**, and that has been failing since ~10 Jul\nbecause the OAuth client-secret file went missing. Three weeks of daily posts,\nnone submitted.\n\nPublishing daily into a site whose commercial pages have no metadata, while not\nsubmitting anything for indexing, is close to the worst possible allocation of a\ncontent engine.\n\n# Measurement\n\n**GA4 only** (`G-JBTXQ3BF5C`), inline in `app/layout.tsx` via `next/script`.\n\n**Zero events fire.** Audit-form submissions and WhatsApp clicks are untracked, so\nno conversion on this site is currently measurable. No GTM, no Plausible, no\nClarity, no Meta pixel.\n\n# See also\n\n- [Routes](/site/routes.md) \u2014 which pages are client components\n- [Blog](/content/blog.md) \u2014 what is being published daily\n- [Lead capture](/content/lead-capture.md) \u2014 the conversion that isn't tracked"}, {"id": "site/stack", "type": "Architecture", "title": "Stack & deployment", "description": "Next.js 16 App Router built with next-on-pages and served from Cloudflare Pages, with D1 and R2 bindings \u2014 and a push to main that deploys production directly.", "tags": ["nextjs", "cloudflare", "pages", "deployment", "tailwind"], "group": "site", "sz": 38, "body": "# Overview\n\n| | |\n|---|---|\n| Framework | **Next.js 16.2.1, App Router** (`app/`, no `pages/`, no `src/`) |\n| React | 19.2.4 |\n| Language | TypeScript 5.8 \u2014 **`strict: false`, `strictNullChecks: false`** |\n| Styling | Tailwind 3.4 + `tailwindcss-animate` + `@tailwindcss/typography`, shadcn/ui (slate, CSS vars), Radix, lucide-react |\n| Fonts | `next/font/google` Geist |\n| Package manager | npm, with `.npmrc` \u2192 `legacy-peer-deps=true` |\n| Host | **Cloudflare Pages** via `@cloudflare/next-on-pages` |\n\n`next-themes` is installed but unused in the layout.\n\n# Deployment\n\n```bash\nnpm run pages:build   # npx @cloudflare/next-on-pages \u2192 .vercel/output/static\n```\n\n`wrangler.toml` sets `pages_build_output_dir = \".vercel/output/static\"`,\n`nodejs_compat`, and two bindings:\n\n| Binding | Resource |\n|---|---|\n| `DB` | D1 `cybiqon-blog` (`0a9bcd34-\u2026ebab`) |\n| `BLOG_IMAGES` | R2, served at `media.cybiqon.in` |\n\n**There is no CI.** No `.github/`, no `vercel.json`, no Dockerfile. Cloudflare\nPages' Git integration builds on push to `main`.\n\n> \u26a0\ufe0f **A push to `main` deploys the live public site.** There is no staging\n> environment, no preview gate, and no workflow file that would make this visible\n> in the repo. `cybiqon-ops/scripts/sync.sh` prints this side-effect next to the\n> repo name for exactly that reason.\n\n# Runtime model\n\nPages that touch D1 declare `export const runtime = \"edge\"` \u2014 the blog index, the\nblog detail page, `sitemap.ts`, and all three API routes.\n\n`lib/db.ts` is the entire data layer:\n\n```ts\nexport function getDB(): D1Database { return getRequestContext().env.DB; }\n```\n\nThat means **every blog page render is a live D1 query at the edge**. There is no\n`generateStaticParams` and no ISR. Fine at current traffic; the first thing to\nrevisit if it grows.\n\n# Images\n\n`next.config.mjs` installs a **custom passthrough loader** (`lib/image-loader.ts`)\n\u2014 Next's image optimisation is disabled entirely. Whatever is uploaded is what\nships, which is why the blog pipeline optimises images with Pillow before pushing\nthem to R2.\n\nPortfolio images are hand-converted WebP in `public/portfolio/` (15 files), after\ncommit `646406e` dropped 24 MB of deploy bloat.\n\n# Secrets\n\nSet out-of-band via `wrangler pages secret put`, never committed:\n`RESEND_API_KEY` (used by [lead capture](/content/lead-capture.md)). Local\ndevelopment uses `.dev.vars`, which is gitignored.\n\n**This is the org's only public repo.** The discipline matters more here than\nanywhere else.\n\n# Branch model\n\nNumbered issue branches (`1-sectional-pages` \u2026 `30-seo-optimization`), plus\n`feat/\u2026` and `redesign/\u2026`, merged via PRs into `main`.\n\n# See also\n\n- [Routes](/site/routes.md) \u2014 what is actually served\n- [Blog](/content/blog.md) \u2014 the D1-backed content system\n- [SEO](/site/seo.md) \u2014 what the edge rendering does and doesn't give us"}], EDGES=[{"source": "content/blog", "target": "site/seo"}, {"source": "content/blog", "target": "site/stack"}, {"source": "content/content-data", "target": "site/routes"}, {"source": "content/content-data", "target": "site/seo"}, {"source": "content/lead-capture", "target": "site/routes"}, {"source": "content/lead-capture", "target": "site/seo"}, {"source": "site/routes", "target": "site/seo"}, {"source": "site/routes", "target": "content/lead-capture"}, {"source": "site/seo", "target": "site/routes"}, {"source": "site/seo", "target": "content/blog"}, {"source": "site/seo", "target": "content/lead-capture"}, {"source": "site/stack", "target": "content/lead-capture"}, {"source": "site/stack", "target": "site/routes"}, {"source": "site/stack", "target": "content/blog"}, {"source": "site/stack", "target": "site/seo"}];
const PALETTE=["#6E56CF","#D97757","#22C55E","#3B82F6","#EAB308","#EC4899","#14B8A6","#F97316","#A855F7","#0EA5E9","#84CC16","#EF4444","#64748B"];
const byId=Object.fromEntries(NODES.map(n=>[n.id,n]));
const outL={}, inL={};
NODES.forEach(n=>{outL[n.id]=[];inL[n.id]=[];});
EDGES.forEach(e=>{outL[e.source].push(e.target);inL[e.target].push(e.source);});
const types=[...new Set(NODES.map(n=>n.type))].sort();
const color=Object.fromEntries(types.map((t,i)=>[t,PALETTE[i%PALETTE.length]]));
const off=new Set();
const cy=cytoscape({container:document.getElementById('cy'),minZoom:.2,maxZoom:1.6,wheelSensitivity:.2,
 elements:[...NODES.map(n=>({data:{...n,c:color[n.type]}})),...EDGES.map(e=>({data:e}))],
 style:[
  {selector:'node',style:{'background-color':'data(c)','label':'data(title)','color':'#e6e8ee',
   'font-size':10,'text-wrap':'wrap','text-max-width':120,'text-valign':'bottom','text-margin-y':4,
   'text-outline-width':2,'text-outline-color':'#0e0f13','min-zoomed-font-size':6,
   'width':'data(sz)','height':'data(sz)'}},
  {selector:'edge',style:{'width':1.2,'line-color':'#3a4150','target-arrow-color':'#3a4150',
   'target-arrow-shape':'triangle','arrow-scale':.8,'curve-style':'bezier','opacity':.7}},
  {selector:'.dim',style:{'opacity':.10}},{selector:'.hl',style:{'border-width':3,'border-color':'#fff'}}
 ],
 layout:{name:'cose',animate:false,nodeRepulsion:9000,idealEdgeLength:90,padding:40}});
const side=document.getElementById('side');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function relList(title,arr){if(!arr.length)return'';
 return `<div class="rel"><h4>${title}</h4>${arr.map(id=>`<a data-go="${esc(id)}">${esc((byId[id]||{}).title||id)}</a>`).join('')}</div>`;}
function show(id){const n=byId[id];if(!n)return;const c=color[n.type];
 side.innerHTML=`<span class="type" style="background:${c}">${esc(n.type)}</span>
 <h2>${esc(n.title)}</h2><div class="desc">${esc(n.description)||'<span class=empty>no description</span>'}</div>
 <div class="tags">${(n.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
 ${relList('Links to',outL[id])}${relList('Cited by',inL[id])}
 <div class="body">${n.body?marked.parse(n.body):'<span class=empty>empty body</span>'}</div>`;
 side.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>select(a.getAttribute('data-go')));}
function select(id){const ele=cy.getElementById(id);if(!ele.length)return;show(id);
 cy.elements().removeClass('hl').addClass('dim');const nb=ele.closedNeighborhood();nb.removeClass('dim');ele.addClass('hl');
 cy.animate({center:{eles:ele},duration:250});
 try{if(decodeURIComponent((location.hash||'').slice(1))!==id)location.hash=encodeURIComponent(id);}catch(e){}}
cy.on('tap','node',e=>select(e.target.id()));
cy.on('tap',e=>{if(e.target===cy)cy.elements().removeClass('dim hl');});
function applyFilter(){const q=document.getElementById('search').value.toLowerCase();const ty=document.getElementById('type').value;
 cy.nodes().forEach(n=>{const d=n.data();
  const m=(!q||(d.title+' '+d.type+' '+d.description+' '+(d.tags||[]).join(' ')).toLowerCase().includes(q))
        &&(!ty||d.type===ty)&&!off.has(d.type);
  n.style('display',m?'element':'none');});}
document.getElementById('search').oninput=applyFilter;
document.getElementById('type').oninput=applyFilter;
const tysel=document.getElementById('type');types.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;tysel.appendChild(o);});
document.getElementById('layout').onchange=e=>{cy.layout({name:e.target.value,animate:true,padding:40,
 nodeRepulsion:9000,idealEdgeLength:90}).run();};
document.getElementById('legend').innerHTML=types.map(t=>`<span class="chip" data-t="${esc(t)}"><span class="dot" style="background:${color[t]}"></span>${esc(t)} (${NODES.filter(n=>n.type===t).length})</span>`).join('');
document.querySelectorAll('#legend .chip').forEach(ch=>ch.onclick=()=>{const t=ch.getAttribute('data-t');
 if(off.has(t)){off.delete(t);ch.classList.remove('off');}else{off.add(t);ch.classList.add('off');}applyFilter();});
document.getElementById('layout').value='cose';
const Q=new URLSearchParams(location.search),QL=Q.get('layout'),QS=Q.get('select');
if(QL&&[...document.querySelectorAll('#layout option')].some(o=>o.value===QL)){document.getElementById('layout').value=QL;cy.layout({name:QL,animate:false,padding:40,nodeRepulsion:9000,idealEdgeLength:90}).run();}
function fromHash(){try{const h=decodeURIComponent((location.hash||'').slice(1));if(h&&byId[h])select(h);}catch(e){}}
addEventListener('hashchange',fromHash);
if(QS&&byId[QS])select(QS);else fromHash();
</script></body></html>
